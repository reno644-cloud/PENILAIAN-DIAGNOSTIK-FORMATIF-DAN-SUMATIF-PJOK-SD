<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generator PENILAIAN PJOK SD SUNGAISELAN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#0ea5e9', // Sky 500
              secondary: '#64748b', // Slate 500
            }
          }
        }
      }
    </script>
    <style>
      /* Custom styles for the generated content preview to ensure it looks like a document */
      .document-preview table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 1.5rem;
        color: #000000; /* Force black text for entire table */
      }
      .document-preview th, .document-preview td {
        border: 1px solid #000;
        padding: 8px;
        text-align: left;
        vertical-align: top;
        color: #000000; /* Force black text */
      }
      .document-preview th {
        background-color: #f3f4f6;
        font-weight: bold;
      }
      .document-preview h2 {
        font-size: 1.5rem;
        font-weight: bold;
        margin-top: 1.5rem;
        margin-bottom: 1rem;
        color: #000000; /* Force black headers */
      }
      .document-preview h3 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-top: 1rem;
        margin-bottom: 0.5rem;
        color: #000000;
      }
      .document-preview p, .document-preview li {
        color: #000000; /* Force black text */
      }
      .document-preview ul, .document-preview ol {
        padding-left: 1.5rem;
        margin-bottom: 1rem;
      }
      .document-preview li {
        margin-bottom: 0.25rem;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",

    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
</head>
  <body class="bg-slate-900 min-h-screen text-slate-100 font-sans">
    <div id="root"></div>
  </body>
</html>
